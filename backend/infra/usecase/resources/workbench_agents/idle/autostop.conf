# VEW idle agent (read by /usr/local/sbin/vew-idle-agent.sh). The agent reports activity
# signals; the hub decides idleness (config/hub.prod.json workbenchLifecycle.idleStop) and stops the
# workbench through VEW. Delivered by the spoke's SSM association; edits here are overwritten.
ENABLED=true
# Only used by the local fallback (ACTION=stop); the hub reads the effective timeout itself.
IDLE_MINUTES=60
# The agent's own busy line in its log; the hub applies its own threshold.
LOAD_THRESHOLD=0.15
# report: publish the signals only (default). stop: also stop locally (fallback, the old behaviour).
ACTION=report
METRICS_NAMESPACE=VEW/Workbench
