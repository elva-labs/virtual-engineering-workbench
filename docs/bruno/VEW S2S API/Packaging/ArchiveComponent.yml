info:
  name: ArchiveComponent
  type: http
  seq: 5
  tags:
    - ALL

http:
  method: DELETE
  url: "{{baseUrl}}/projects/:projectId/components/:componentId"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
  params:
    - name: projectId
      value: ""
      type: path
    - name: componentId
      value: ""
      type: path
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Component updated or archived.
    request:
      url: "{{baseUrl}}/projects/:projectId/components/:componentId"
      method: DELETE
      headers:
        - name: Authorization
          value: "{{apiKey}}"
      params:
        - name: projectId
          value: ""
          type: path
        - name: componentId
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: "{}"
  - name: default Response
    description: RFC problem response.
    request:
      url: "{{baseUrl}}/projects/:projectId/components/:componentId"
      method: DELETE
      headers:
        - name: Authorization
          value: "{{apiKey}}"
      params:
        - name: projectId
          value: ""
          type: path
        - name: componentId
          value: ""
          type: path
    response:
      headers:
        - name: Content-Type
          value: application/problem+json
      body:
        type: json
        data: |-
          {
