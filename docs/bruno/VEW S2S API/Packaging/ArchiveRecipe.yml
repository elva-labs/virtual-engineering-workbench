info:
  name: ArchiveRecipe
  type: http
  seq: 15
  tags:
    - ALL

http:
  method: DELETE
  url: "{{baseUrl}}/projects/:projectId/recipes/:recipeId"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
  params:
    - name: projectId
      value: ""
      type: path
    - name: recipeId
      value: ""
      type: path
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
