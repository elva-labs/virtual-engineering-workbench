info:
  name: CreateComponent
  type: http
  seq: 2
  tags:
    - ALL

http:
  method: POST
  url: "{{baseUrl}}/projects/:projectId/components"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
    - name: Idempotency-Key
      value: 7b60fdad-c26b-4189-abf8-30c7bb901e72
  params:
    - name: projectId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "componentName": "",
        "componentDescription": "",
        "componentPlatform": "",
        "componentSupportedArchitectures": [],
        "componentSupportedOsVersions": []
      }
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
