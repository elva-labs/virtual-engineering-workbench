    description: Created component identifier.
    request:
      url: "{{baseUrl}}/projects/:projectId/components"
      method: POST
      headers:
        - name: Authorization
          value: "{{apiKey}}"
        - name: Idempotency-Key
          value: 7b60fdad-c26b-4189-abf8-30c7bb901e72
      params:
        - name: projectId
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "componentName": "",
            "componentDescription": "",
            "componentPlatform": "",
            "componentSupportedArchitectures": [],
            "componentSupportedOsVersions": []
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "componentId": ""
          }
