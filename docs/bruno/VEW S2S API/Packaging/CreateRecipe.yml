info:
  name: CreateRecipe
  type: http
  seq: 12
  tags:
    - ALL

http:
  method: POST
  url: "{{baseUrl}}/projects/:projectId/recipes"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
    - name: Idempotency-Key
      value: 7b60fdad-c26b-4189-abf8-30c7bb901e72
  params:
    - name: projectId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "recipeDescription": "",
        "recipeName": "",
        "recipePlatform": "",
        "recipeArchitecture": "",
        "recipeOsVersion": ""
      }
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

