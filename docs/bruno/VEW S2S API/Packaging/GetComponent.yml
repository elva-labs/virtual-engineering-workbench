info:
  name: GetComponent
  type: http
  seq: 3
  tags:
    - ALL

http:
  method: GET
  url: "{{baseUrl}}/projects/:projectId/components/:componentId"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
  params:
    - name: projectId
      value: "{{projectId}}"
      type: path
    - name: componentId
      value: comp-bupifrxj
      type: path
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

