info:
  name: ListRecipes
  type: http
  seq: 13
  tags:
    - ALL

http:
  method: GET
  url: "{{baseUrl}}/projects/:projectId/recipes"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
  params:
    - name: projectId
      value: ""
      type: path
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Recipe page.
    request:
      url: "{{baseUrl}}/projects/:projectId/recipes"
      method: GET
      headers:
        - name: Authorization
          value: "{{apiKey}}"
      params:
        - name: projectId
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "recipes": [
              {
                "recipeId": "",
                "recipeDescription": "",
                "recipeName": "",
                "recipePlatform": "",
