info:
  name: RetireComponentVersion
  type: http
  seq: 10
  tags:
    - ALL

http:
  method: DELETE
  url: "{{baseUrl}}/projects/:projectId/components/:componentId/versions/:versionId"
  headers:
    - name: Authorization
      value: "{{apiKey}}"
  params:
    - name: projectId
      value: ""
      type: path
    - name: componentId
      value: ""
      type: path
    - name: versionId
      value: ""
      type: path
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

