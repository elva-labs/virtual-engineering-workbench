info:
  name: GetAvailableProducts
  type: http
  seq: 1
  tags:
    - ALL

http:
  method: GET
  url: "{{baseUrl}}/projects/:projectId/products/available"
  params:
    - name: projectId
      value: ""
      type: path
    - name: productType
      value: ""
      type: query
    - name: filter
      value: "[]"
      type: query
      disabled: true
  auth:
    type: apikey
    key: Authorization
    value: "{{apiKey}}"
    placement: header

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

